<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://use.typekit.net/ouu2gxk.css">
  <link rel="stylesheet" href="/src/login.css">
</head>
<body class="split-page">

<div class="split-screen">
  <div class="split-left">
    <div class="login-wrap">
      <div class="login-card">
        <h1 class="login-heading">Design Studio Sign In</h1>

        <form id="loginForm" class="login-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
          </div>
          <p id="loginError" class="login-error" style="display:none"></p>
          <button type="submit" class="login-btn" id="loginBtn">Sign in</button>
        </form>

        <p class="login-alt-link"><a href="/reset-password-request.html">Forgot password?</a></p>
      </div>

      <p class="login-alt-link login-alt-link-outside">Don't have an account? <a href="/signup.html">Sign up</a></p>
    </div>
  </div>

  <div class="split-right">
    <div class="split-right-content">
      <h2>Design Golf Flags and Hole Signs</h2>
    </div>
  </div>
</div>

<script type="module" src="/src/login.js"></script>
</body>
</html>
