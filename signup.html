<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up · Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://use.typekit.net/ouu2gxk.css">
  <link rel="stylesheet" href="/src/login.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <h1 class="login-heading" id="signupHeading">Create your account</h1>

    <form id="signupForm" class="login-form" novalidate>
      <div class="field">
        <label for="firstName">First name</label>
        <input id="firstName" type="text" autocomplete="given-name" required>
      </div>
      <div class="field">
        <label for="lastName">Last name</label>
        <input id="lastName" type="text" autocomplete="family-name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" placeholder="At least 10 characters" required minlength="10">
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" required minlength="10">
      </div>
      <p id="signupError" class="login-error" style="display:none"></p>
      <button type="submit" class="login-btn" id="signupBtn">Create account</button>
    </form>

    <p id="signupNotice" class="login-notice" style="display:none"></p>

    <p class="login-alt-link">Already have an account? <a href="/login.html">Sign in</a></p>
  </div>
</div>

<script type="module" src="/src/signup.js"></script>
</body>
</html>
